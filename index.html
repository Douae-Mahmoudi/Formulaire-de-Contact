<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire avec Popup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <form id="formulaire" method="post">
        <h2>Formulaire de Contact</h2>
        <input type="text" placeholder="Nom" required><br>
        <input type="email" placeholder="Email" required><br>
        <textarea placeholder="Votre message" rows="4" required></textarea><br>
        <button type="submit" class="btn">Envoyer</button>
    </form>

    <div class="popup" id="popup">
        <img src="IMG/checked.png" alt="Check Icon" class="check-img">
        <h2>Merci</h2>
        <p>Vos informations ont été envoyées avec succès !</p>
        <button type="button" onclick="closePopup()">OK</button>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
